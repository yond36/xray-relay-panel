name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I tools/check_release.py --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.sha }}
          path: release
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          Path('release-notes.md').write_text(f'''Xray Relay Panel {tag}

          中文 Xray 中转面板，支持入口节点、出口节点、转发管理、多用户、官方核心版本手动选择和 VLESS-REALITY 默认入口。

          新建转发从 `10000..65535` 随机选择监听端口，避开同一入口节点已保存转发的端口；点击“随机端口”可重新抽取，手动填写的端口和编辑已有转发的端口保留。随机选择只参考已保存转发，系统监听冲突仍在应用节点配置时检查。

          新建 REALITY 的默认 target / SNI 改为 `www.cloudflare.com:443` / `www.cloudflare.com`，与后端默认值一致。隔离测试中，Xray-core `v26.6.27` 配合微软目标失败、配合 Cloudflare 目标成功；`v26.10.31` 配合两者均成功。

          本次线上验收保持服务端核心为 `v26.6.27`，仅将既有 REALITY 转发的 target / SNI 从微软目标切换为 Cloudflare。外部官方 Xray 客户端 `v26.10.31`、`v1.8.24` 的 VLESS 请求及 Shadowsocks 对照请求均成功，观察到相同出口 IP；既有端口、UUID、密钥、short ID、flow 与出口选择保留，原有 x-ui / Xray 服务的 unit、进程与配置未变化。本次结果限于记录中的环境与请求，验证记录见 [docs/verification-{tag}.md](https://github.com/yond36/xray-relay-panel/blob/{tag}/docs/verification-{tag}.md)。

          升级后请刷新浏览器页面，加载新版表单。默认值调整作用于新建转发；已有 REALITY 转发如需切换目标，请修改 target / SNI 并应用节点配置，再重新复制分享链接或刷新客户端订阅，以更新客户端 SNI。保存或出口探测不代表目标站已通过 REALITY 兼容性验证。

          一键安装：
          ```sh
          curl -fsSL https://raw.githubusercontent.com/yond36/xray-relay-panel/main/install.sh | sudo bash -s -- install
          ```

          新安装默认监听 `0.0.0.0:8080`，可通过 `http://服务器公网IP:8080` 初始化管理员；服务器安全组或防火墙需允许 TCP 8080。升级和重装保留已有 `panel.env` 配置。

          默认卸载保留数据及已运行的中转：
          ```sh
          sudo xray-relay-panel uninstall
          ```

          Linux AMD64 / ARM64 安装包、源码和一键脚本均附 SHA-256。具体升级、清理与服务隔离说明见 README。ARM64 完成交叉构建，未进行 ARM64 实机验收。
          ''', encoding='utf-8')
          PY
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Xray Relay Panel $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
