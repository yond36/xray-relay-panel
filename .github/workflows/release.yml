name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -I tools/check_release.py --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.sha }}
          path: release
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          Path('release-notes.md').write_text(f'''Xray Relay Panel {tag}

          中文 Xray 中转面板，支持入口节点、出口节点、转发管理、多用户、官方核心版本手动选择和 VLESS-REALITY 默认入口。

          已应用转发支持直接删除：点击删除并确认后，面板自动应用排除此规则的入口配置，并处理节点侧及面板中的相关回滚引用，成功后才删除记录。未部署的规则继续即时删除。

          删除任务有独立进度和结果，失败或中断时保留规则及凭据，可直接重试。删除会同时应用该入口其他待生效配置，现有连接可能短暂重连；无需先手动禁用并应用。删除意图持久化，未完成协调时阻止使用不确定的回滚配置。

          删除最后一条转发后应用无入口、默认拒绝的配置。配置和节点操作继续限定于面板自己的独立中转服务。验证范围及结果见 [docs/verification-{tag}.md](https://github.com/yond36/xray-relay-panel/blob/{tag}/docs/verification-{tag}.md)。

          升级后请刷新浏览器页面，加载新版删除流程：
          ```sh
          sudo xray-relay-panel upgrade --version {tag}
          ```

          一键安装：
          ```sh
          curl -fsSL https://raw.githubusercontent.com/yond36/xray-relay-panel/main/install.sh | sudo bash -s -- install
          ```

          新安装默认监听 `0.0.0.0:8080`，可通过 `http://服务器公网IP:8080` 初始化管理员；服务器安全组或防火墙需允许 TCP 8080。升级和重装保留已有 `panel.env` 配置。

          默认卸载保留数据及已运行的中转：
          ```sh
          sudo xray-relay-panel uninstall
          ```

          Linux AMD64 / ARM64 安装包、源码和一键脚本均附 SHA-256。具体升级、清理与服务隔离说明见 README。ARM64 完成交叉构建，未进行 ARM64 实机验收。
          ''', encoding='utf-8')
          PY
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Xray Relay Panel $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
